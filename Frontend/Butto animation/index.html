<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Animation Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0b0c10;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding: 100px 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        /* Glassmorphism Button */
        .glass-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease-in-out;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.08);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .glass-btn:active {
            transform: scale(0.95);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        /* Neon Glow Button */
        .neon-btn {
            background: linear-gradient(135deg, #6f7dfb, #26308c);
            color: #fff;
            font-weight: bold;
            padding: 14px 35px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            transition: all 0.4s ease-in-out;
            box-shadow: 0 0 10px rgba(111, 125, 251, 0.6),
                        0 0 20px rgba(38, 48, 140, 0.5);
        }

        .neon-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px #6f7dfb,
                        0 0 30px #26308c,
                        0 0 45px #6f7dfb;
            background: linear-gradient(135deg, #26308c, #6f7dfb);
        }

        .neon-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 8px rgba(111, 125, 251, 0.7);
        }

        .btn-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <h1>Button Animation Demo</h1>
    <p>Click and hover to test both button styles</p>

    <div class="btn-container">
        <!-- Glassmorphism Button -->
        <button type="button" class="glass-btn">
            <svg class="mb-1 me-2" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                fill="currentColor" viewBox="0 0 16 16">
                <path
                    d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 
                       0 0 1 .707 0l1.293 1.293zm-1.75 
                       2.456-2-2L4.939 9.21a.5.5 
                       0 0 0-.121.196l-.805 
                       2.414a.25.25 0 0 
                       0 .316.316l2.414-.805a.5.5 
                       0 0 0 .196-.12l6.813-6.814z" />
                <path fill-rule="evenodd"
                    d="M1 13.5A1.5 1.5 0 0 0 2.5 
                       15h11a1.5 1.5 0 0 
                       0 1.5-1.5v-6a.5.5 
                       0 0 0-1 0v6a.5.5 
                       0 0 1-.5.5h-11a.5.5 
                       0 0 1-.5-.5v-11a.5.5 
                       0 0 1 .5-.5H9a.5.5 
                       0 0 0 0-1H2.5A1.5 1.5 
                       0 0 0 1 2.5z" />
            </svg>
            Enrol Now
        </button>

        <!-- Neon Glow Button -->
        <button type="button" class="neon-btn">
            <svg class="mb-1 me-2" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                fill="currentColor" viewBox="0 0 16 16">
                <path
                    d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 
                       0 0 1 .707 0l1.293 1.293zm-1.75 
                       2.456-2-2L4.939 9.21a.5.5 
                       0 0 0-.121.196l-.805 
                       2.414a.25.25 0 0 
                       0 .316.316l2.414-.805a.5.5 
                       0 0 0 .196-.12l6.813-6.814z" />
                <path fill-rule="evenodd"
                    d="M1 13.5A1.5 1.5 0 0 0 2.5 
                       15h11a1.5 1.5 0 0 
                       0 1.5-1.5v-6a.5.5 
                       0 0 0-1 0v6a.5.5 
                       0 0 1-.5.5h-11a.5.5 
                       0 0 1-.5-.5v-11a.5.5 
                       0 0 1 .5-.5H9a.5.5 
                       0 0 0 0-1H2.5A1.5 1.5 
                       0 0 0 1 2.5z" />
            </svg>
            Enrol Now
        </button>
    </div>
</body>
</html>
