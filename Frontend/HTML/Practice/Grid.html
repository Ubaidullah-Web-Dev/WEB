<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>
    <h1 class="simple-grid">Simple Grid</h1>
    <div class="container-1">
        <div class="item-1">1</div>
        <div class="item-2">2</div>
        <div class="item-3">3</div>
        <div class="item-4">4</div>
    </div>
    <h1 class="advanced-grid">Advanced Grid</h1>
    <div class="container-2">
        <div class="a-item-1">1</div>
        <div class="a-item-2">2</div>
        <div class="a-item-3">3</div>
        <div class="a-item-4">4</div>
        <div class="a-item-5">5</div>
        <div class="a-item-6">6</div>
    </div>
    <h1 class="final-grid">Final Grid</h1>
    <div class="container-3">
        <div class="f-item-1">1</div>
        <div class="f-item-2">2</div>
        <div class="f-item-3">3</div>
        <div class="f-item-4">4</div>
        <div class="f-item-5">5</div>
        <div class="f-item-6">6</div>
    </div>
</body>

</html>
