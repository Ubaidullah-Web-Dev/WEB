<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>

<body>
    <main>
        <div class="main-div">
            <div class="top-area">
                <input class="form" type="number">
            </div>
            <div class="container">
                <div class="item">
                    <button type="button" class="button-s"><b>AC</b></button>
                </div>
                <div class="item">
                    <button type="button" class="button-s"><b>X</b></button>
                </div>
                <div class="item">
                    <button type="button" class="button-s"><b>%</b></button>
                </div>
                <div class="item">
                    <button type="button" class="button-s"><b>÷</b></button>
                </div>
                <div class="item">
                    <button type="button" class="button">7</button>
                </div>
                <div class="item">
                    <button type="button" class="button">8</button>
                </div>
                <div class="item">
                    <button type="button" class="button">9</button>
                </div>
                <div class="item">
                    <button type="button" class="button-s"><b>x</b></button>
                </div>
                <div class="item">
                    <button type="button" class="button">4</button>
                </div>
                <div class="item">
                    <button type="button" class="button">5</button>
                </div>
                <div class="item">
                    <button type="button" class="button">6</button>
                </div>
                <div class="item">
                    <button type="button" class="button-s"><b>-</b></button>
                </div>
                <div class="item">
                    <button type="button" class="button">1</button>
                </div>
                <div class="item">
                    <button type="button" class="button">2</button>
                </div>
                <div class="item">
                    <button type="button" class="button">3</button>
                </div>
                <div class="item">
                    <button type="button" class="button-s"><b>+</b></button>
                </div>
                <div class="item">
                    <button type="button" class="button-s"><b>!</b></button>
                </div>
                <div class="item">
                    <button type="button" class="button">0</button>
                </div>
                <div class="item">
                    <button type="button" class="button">.</button>
                </div>
                <div class="item">
                    <button type="button" class="button-ss"><b>=</b></button>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
