<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Calculator</title>
</head>
<body>
  <h2>Basic Calculator</h2>
  <input type="text" id="display" readonly><br><br>

  <!-- Number buttons -->
  <button onclick="display.value += '1'">1</button>
  <button onclick="display.value += '2'">2</button>
  <button onclick="display.value += '3'">3</button>
  <button onclick="setOp('+')">+</button><br>

  <button onclick="display.value += '4'">4</button>
  <button onclick="display.value += '5'">5</button>
  <button onclick="display.value += '6'">6</button>
  <button onclick="setOp('-')">-</button><br>

  <button onclick="display.value += '7'">7</button>
  <button onclick="display.value += '8'">8</button>
  <button onclick="display.value += '9'">9</button>
  <button onclick="setOp('*')">*</button><br>

  <button onclick="display.value += '0'">0</button>
  <button onclick="clearAll()">C</button>
  <button onclick="calculate()">=</button>
  <button onclick="setOp('/')">/</button>

  <script>
    let display = document.getElementById("display");
    let num1 = "";
    let num2 = "";
    let op = "";

    function setOp(operator) {
      num1 = display.value;  // first number
      op = operator;         // save operator
      display.value = "";    // clear for second number
    }

    function calculate() {
      num2 = display.value; // second number
      let result;
      switch(op) {
        case "+":
          result = parseFloat(num1) + parseFloat(num2);
          break;
        case "-":
          result = parseFloat(num1) - parseFloat(num2);
          break;
        case "*":
          result = parseFloat(num1) * parseFloat(num2);
          break;
        case "/":
          result = (num2 == 0) ? "Error" : parseFloat(num1) / parseFloat(num2);
          break;
        default:
          result = "Error";
      }
      display.value = result;
    }

    function clearAll() {
      display.value = "";
      num1 = "";
      num2 = "";
      op = "";
    }
  </script>
</body>
</html>
