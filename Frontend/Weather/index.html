<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="background-animation"></div>
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="weather-card d-flex flex-wrap">
      <div class="left-card text-white p-4">
        <div class="overlay"></div>
        <div class="d-flex flex-column justify-content-between h-100 position-relative">
          <div>
            <h3 class="fade-in"><i class="bi-geo-alt-fill fw-bold"></i> <span id="location" class="fw-bold">Biarritz,
                FR</span></h3>
          </div>
          <div class="fade-in text-center">
            <div class="weather-icon mb-2" id="icon">
              <i class="bi bi-brightness-high fs-1"></i>
            </div>
            <h1 class="display-5 fw-bold" id="temperature">29°C</h1>
            <p class="mb-0 fs-5" id="description">Sunny</p>
          </div>
        </div>
      </div>
      <div class="right-card text-white p-4">
        <div class="fade-in">
          <div class="d-flex justify-content-between mb-2">
            <span>HUMIDITY</span><span id="humidity">42%</span>
          </div>
          <div class="d-flex justify-content-between mb-4">
            <span>WIND</span><span id="wind">3 km/h</span>
          </div>
        </div>
        <div class="forecast d-flex justify-content-between mb-4 fade-in" id="forecast">
          <div class="day text-center active">
            <i class="bi bi-brightness-high"></i>
            <p class="mb-0">Tue</p>
            <span>30°C</span>
          </div>
          <div class="day text-center">
            <i class="bi bi-cloud"></i>
            <p class="mb-0">Wed</p>
            <span>22°C</span>
          </div>
          <div class="day text-center">
            <i class="bi bi-cloud-rain"></i>
            <p class="mb-0">Thu</p>
            <span>06°C</span>
          </div>
          <div class="day text-center">
            <i class="bi bi-brightness-high"></i>
            <p class="mb-0">Fri</p>
            <span>26°C</span>
          </div>
        </div>
        <div class="search-container">
          <input type="text" id="city-input" placeholder="Enter city name..." />
          <button id="search-btn"><i class="bi bi-search"></i></button>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
  
</body>

</html>
