<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Animated background gradient -->
  <div class="background-animation"></div>

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="weather-card d-flex flex-wrap">
      
      <!-- Left Panel -->
      <div class="left-card text-white p-4">
        <div class="overlay"></div>
        <div class="d-flex flex-column justify-content-between h-100 position-relative">
          <div>
            <h3 class="fw-bold fade-in">Tuesday</h3>
            <p class="mb-1 fade-in">20 Jun 2022</p>
            <p class="fade-in"><i class="bi bi-geo-alt-fill"></i> Biarritz, FR</p>
          </div>
          <div class="fade-in">
            <div class="weather-icon mb-2">
              <i class="bi bi-brightness-high fs-1"></i>
            </div>
            <h1 class="display-5 fw-bold">29°C</h1>
            <p class="mb-0 fs-5">Sunny</p>
          </div>
        </div>
      </div>

      <!-- Right Panel -->
      <div class="right-card text-white p-4">
        <div class="fade-in">
          <div class="d-flex justify-content-between mb-2">
            <span>PRECIPITATION</span><span>0%</span>
          </div>
          <div class="d-flex justify-content-between mb-2">
            <span>HUMIDITY</span><span>42%</span>
          </div>
          <div class="d-flex justify-content-between mb-4">
            <span>WIND</span><span>3 km/h</span>
          </div>
        </div>

        <div class="forecast d-flex justify-content-between mb-4 fade-in">
          <div class="day text-center active">
            <i class="bi bi-brightness-high"></i>
            <p class="mb-0">Tue</p>
            <span>30°C</span>
          </div>
          <div class="day text-center">
            <i class="bi bi-cloud"></i>
            <p class="mb-0">Wed</p>
            <span>22°C</span>
          </div>
          <div class="day text-center">
            <i class="bi bi-cloud-rain"></i>
            <p class="mb-0">Thu</p>
            <span>06°C</span>
          </div>
          <div class="day text-center">
            <i class="bi bi-brightness-high"></i>
            <p class="mb-0">Fri</p>
            <span>26°C</span>
          </div>
        </div>

        <button class="btn btn-gradient w-100 fade-in">
          <i class="bi bi-geo-alt"></i> Change Location
        </button>
      </div>
    </div>
  </div>
</body>
</html>
