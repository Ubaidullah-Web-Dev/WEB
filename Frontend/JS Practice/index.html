            // This is a promise that fetches data from a public API
            let mypromise = new Promise(function (resolve, reject) {
                fetch('https://jsonplaceholder.typicode.com/todos/1') // API call
                    .then(response => {
                        if (!response.ok) {
                            reject('Network response was not ok'); // reject if HTTP error
                        }
                        return response.json(); // parse JSON
                    })
                    .then(data => {
                        resolve(data); // resolve the promise with the data
                    })
                    .catch(error => {
                        reject(error); // reject if fetch fails
                    });
            });

            mypromise.then(
                function (value) {
                    console.log("Data received:", value); // success
                },
                function (error) {
                    console.log("Error:", error); // error
                }
            );
